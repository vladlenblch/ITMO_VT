limit: 1000
memory_size: 0x1000
memory_mapped_io:
  0x80: [16]
  0x84: []
reports:
  - name: "Debug Info"
    slice: all
    view: |
      {pc}: {instruction} {pc:label}
  - name: "Result Verification"
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [27]
